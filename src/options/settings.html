<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>B站关注视频提醒 · 设置</title><link rel="stylesheet" href="settings.css">
</head>
<body>
<main>
  <header><img src="../../assets/icon.png" alt="" width="52" height="52"><div><h1>B站关注视频提醒</h1><p>在桌面接收关注 UP 主的投稿、动态和开播提醒。</p></div></header>
  <section aria-labelledby="status-title">
    <div class="section-head"><h2 id="status-title">运行状态</h2><span id="badge">正在读取</span></div>
    <dl><div><dt>当前账号</dt><dd id="account">尚未检查</dd></div><div><dt>上次尝试</dt><dd id="attempt">—</dd></div><div><dt>上次成功</dt><dd id="success">—</dd></div><div><dt>下次检查</dt><dd id="next">—</dd></div></dl>
    <p id="note" class="hint"></p><p id="error" class="error" role="alert" hidden></p>
    <div class="buttons">
      <button id="check" type="button">立即检查</button>
      <button id="test-video" class="secondary" type="button">测试投稿</button>
      <button id="test-dynamic" class="secondary" type="button">测试动态</button>
      <button id="test-live" class="secondary" type="button">测试直播</button>
      <a href="https://www.bilibili.com/" target="_blank" rel="noreferrer">打开 B站 / 登录</a>
    </div>
    <p id="check-feedback" class="hint" role="status"></p>
    <button id="test-live-demo" class="secondary" type="button" hidden>发送演示通知</button>
  </section>
  <section aria-labelledby="settings-title">
    <h2 id="settings-title">提醒设置</h2>
    <form id="settings">
      <label class="toggle"><input id="enabled" type="checkbox">启用自动检查与通知</label>
      <div class="fields"><label>检查间隔（分钟）<input id="interval" type="number" min="1" max="60" step="1" required><small>支持 1～60 分钟，默认 3 分钟。失败时自动延长至最多 60 分钟。</small></label>
      <label>视频和动态的检查页数<input id="maxPages" type="number" min="1" max="10" step="1" required><small>每类最多检查这么多页，默认 5 页。</small></label></div>
      <div id="rules"></div>
      <label class="toggle"><input id="silent" type="checkbox">静音通知（仍显示桌面横幅）</label>
      <div class="buttons"><button type="submit">保存设置</button><span id="feedback" role="status" aria-live="polite"></span></div>
    </form>
  </section>
  <section aria-labelledby="history-title"><div class="section-head"><h2 id="history-title">最近检测到的内容</h2><span class="hint">最多保留 100 条</span></div><p class="hint">检测记录包含初次读到的内容，不代表每条都发送过通知。</p><div id="history"></div></section>
  <footer>Edge 自动沿用 B站登录状态。各类提醒首次开启时，只记录已有内容。<br>需要 Edge 在后台运行。电脑休眠、断网或浏览器完全退出时无法按时检查。</footer>
</main>
<dialog id="follow-picker" aria-labelledby="picker-title" aria-describedby="picker-description">
  <div class="picker-header">
    <div>
      <h2 id="picker-title">选择 UP 主</h2>
      <p id="picker-description" class="hint">从当前 B 站账号的关注列表中选择</p>
    </div>
    <button id="picker-close" class="secondary picker-close" type="button" aria-label="关闭选择面板">×</button>
  </div>
  <div id="picker-kinds" role="group" aria-label="提醒类别"></div>
  <div class="picker-filters">
    <input id="picker-search" type="search" placeholder="搜索 UP 主昵称" aria-label="搜索 UP 主昵称" autofocus>
    <label class="toggle"><input id="picker-only-selected" type="checkbox">仅看已选</label>
  </div>
  <div class="picker-bulk" role="group" aria-label="批量选择" aria-describedby="picker-bulk-hint">
    <button class="secondary" type="button" data-selection="all" disabled>全选</button>
    <button class="secondary" type="button" data-selection="invert" disabled>反选</button>
    <button class="secondary" type="button" data-selection="none" disabled>全不选</button>
    <span id="picker-bulk-hint" class="hint">仅作用于当前列表</span>
  </div>
  <div id="picker-list" role="group" aria-label="UP 主列表"></div>
  <div class="picker-progress">
    <p id="picker-status" class="hint" role="status"></p>
    <button id="picker-retry" class="secondary" type="button" hidden>重试加载</button>
  </div>
  <div class="picker-footer">
    <div>
      <strong id="picker-count" aria-live="polite"></strong>
      <small id="picker-scope"></small>
      <small>确认后回到设置页，再点「保存设置」。</small>
    </div>
    <div class="buttons">
      <button id="picker-cancel" class="secondary" type="button">取消</button>
      <button id="picker-confirm" type="button">确认</button>
    </div>
  </div>
</dialog>
<template id="rule-template">
  <fieldset class="rule">
    <legend></legend>
    <label>提醒范围<select>
      <option value="off">关闭</option>
      <option value="all">所有已关注的 UP 主</option>
      <option value="selected">仅指定的已关注 UP 主</option>
    </select></label>
    <div class="rule-selection" hidden>
      <strong></strong>
      <button type="button" aria-haspopup="dialog">选择 UP 主</button>
    </div>
  </fieldset>
</template>
<script type="module" src="settings.js"></script>
</body>
</html>
